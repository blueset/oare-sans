<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Oare Sans Embed</title>
	<link rel="stylesheet" href="./fonts/oare-sans.css">
	<style>
		:root {
			/*
			 * Opt into both light and dark schemes so the iframe's used color
			 * scheme can match a dark embedding page. Without this the document
			 * defaults to light, and Chromium paints an opaque white backdrop
			 * behind the transparent iframe when it's embedded in a dark-scheme
			 * page, defeating `background: transparent`.
			 */
			color-scheme: light dark;
			/* Primary text color, overridable via the `color` URL parameter. */
			--text-color: #1a1a1a;
			/* Text color used on inverted stages, overridable via the `invertColor` URL parameter. */
			--invert-text-color: #fff;
			/* Font-size bounds used when fitting one-liners to the container. */
			--min-font-size: 16px;
			--max-font-size: 180px;
		}

		html,
		body {
			margin: 0;
			padding: 0;
			background: transparent;
		}

		body {
			font-family: "Oare Sans", system-ui, sans-serif;
			color: var(--text-color);
			-webkit-font-smoothing: antialiased;
			text-rendering: optimizeLegibility;
		}

		.content {
			padding: 1rem;
		}

		.one-liners {
			display: flex;
			flex-direction: column;
			gap: 0.75rem;
		}

		.one-liner {
			display: flex;
			flex-direction: column;
			gap: 0.25rem;
			/* Establish a query container so the text can size with `cqw`. */
			container-type: inline-size;
		}

		.one-liner__style {
			align-self: flex-start;
			font-family: system-ui, sans-serif;
			font-size: 0.75rem;
			color: color-mix(in srgb, var(--text-color) 60%, transparent);
			background: transparent;
			border: 0px;
			padding: 2px 4px;
			cursor: pointer;
		}

		.one-liner__text {
			display: block;
			width: 100%;
			white-space: nowrap;
			overflow: hidden;
			line-height: 1.1;
			outline: none;
      text-align: center;
			color: var(--text-color);
      padding: 0 0.25rem;
			/*
			 * `--fit` is a unitless coefficient computed in JS so that
			 * `--fit * 1cqw` equals the font size that makes the text span the
			 * full container width. `clamp()` keeps it within the configured
			 * bounds and `cqw` makes it track container width without JS resize.
			 */
			font-size: clamp(
				var(--min-font-size),
				calc(var(--fit, 10) * 1cqw),
				var(--max-font-size)
			);
			font-variation-settings: "wght" var(--wght, 400), "slnt" var(--slnt, 0);
		}

		.one-liner__text:empty::before {
			content: attr(data-placeholder);
			opacity: 0.4;
		}

		/* ---- Flagger ---- */
		.flagger {
			display: flex;
			flex-direction: column;
			gap: 1.5rem;
			margin-top: 2.5rem;
		}

		.flagger__controls {
			display: flex;
			flex-wrap: wrap;
			gap: 1.25rem;
			font-family: system-ui, sans-serif;
			font-size: 0.8rem;
			color: color-mix(in srgb, var(--text-color) 70%, transparent);
		}

		.flagger__controls .ctl {
			display: flex;
			flex-direction: column;
			gap: 0.4rem;
		}

		/* Header row of a control: name, live value and optional reset. */
		.ctl__label {
			display: flex;
			align-items: center;
			gap: 0.4rem;
		}

		.ctl__value {
			color: var(--text-color);
			font-variant-numeric: tabular-nums;
		}

		.ctl__reset {
			margin-left: auto;
			height: 1.1rem;
			padding: 0 0.35rem;
			font-family: system-ui, sans-serif;
			font-size: 0.7rem;
			color: color-mix(in srgb, var(--text-color) 70%, transparent);
			background: transparent;
			border: 1px solid color-mix(in srgb, var(--text-color) 30%, transparent);
			border-radius: 3px;
			cursor: pointer;
		}

		.ctl__reset:hover {
			color: var(--text-color);
			border-color: color-mix(in srgb, var(--text-color) 60%, transparent);
		}

		/* Give every control's interactive area the same height so the
		   sliders, button groups and icon picker line up on one baseline. */
		.flagger__controls .ctl > .flagger__toggle,
		.flagger__controls .ctl > .flagger__icon-picker {
			display: flex;
			align-items: center;
			min-height: 1.75rem;
		}

		/* ---- Minimal range sliders ---- */
		.flagger__controls input[type="range"] {
			-webkit-appearance: none;
			appearance: none;
			width: 100%;
			min-width: 8rem;
			height: 1.75rem;
			margin: 0;
			padding: 0;
			background: transparent;
			cursor: pointer;
		}

		.flagger__controls input[type="range"]::-webkit-slider-runnable-track {
			height: 2px;
			border-radius: 2px;
			background: color-mix(in srgb, var(--text-color) 25%, transparent);
		}

		.flagger__controls input[type="range"]::-moz-range-track {
			height: 2px;
			border-radius: 2px;
			background: color-mix(in srgb, var(--text-color) 25%, transparent);
		}

		.flagger__controls input[type="range"]::-webkit-slider-thumb {
			-webkit-appearance: none;
			appearance: none;
			width: 12px;
			height: 12px;
			margin-top: -5px;
			border: none;
			border-radius: 50%;
			background: var(--text-color);
			transition: transform 0.1s ease;
		}

		.flagger__controls input[type="range"]::-moz-range-thumb {
			width: 12px;
			height: 12px;
			border: none;
			border-radius: 50%;
			background: var(--text-color);
			transition: transform 0.1s ease;
		}

		.flagger__controls input[type="range"]:hover::-webkit-slider-thumb {
			transform: scale(1.2);
		}

		.flagger__controls input[type="range"]:hover::-moz-range-thumb {
			transform: scale(1.2);
		}

		.flagger__controls input[type="range"]:focus-visible {
			outline: none;
		}

		.flagger__controls input[type="range"]:focus-visible::-webkit-slider-thumb {
			box-shadow: 0 0 0 3px color-mix(in srgb, var(--text-color) 30%, transparent);
		}

		.flagger__controls input[type="range"]:focus-visible::-moz-range-thumb {
			box-shadow: 0 0 0 3px color-mix(in srgb, var(--text-color) 30%, transparent);
		}

		.flagger__toggle {
			display: flex;
			gap: 0.35rem;
		}

		.flagger__toggle button {
			width: 2.5rem;
			height: 1.75rem;
			padding: 0;
			border: 1px solid color-mix(in srgb, var(--text-color) 40%, transparent);
			background: linear-gradient(to bottom, var(--swatch-start), var(--swatch-end));
			border-radius: 4px;
			cursor: pointer;
			font-size: 0;
		}

		.flagger__toggle button[aria-pressed="true"] {
			outline: 2px solid var(--text-color);
			outline-offset: 1px;
			border-color: transparent;
		}

		.flagger__toggle--text button {
			width: auto;
			height: 1.75rem;
			padding: 0 0.6rem;
			font-family: system-ui, sans-serif;
			font-size: 0.8rem;
			background: transparent;
			color: color-mix(in srgb, var(--text-color) 70%, transparent);
		}

		.flagger__toggle--text button[aria-pressed="true"] {
			outline: none;
			background: color-mix(in srgb, var(--text-color) 12%, transparent);
			color: var(--text-color);
			border-color: color-mix(in srgb, var(--text-color) 70%, transparent);
		}

		/* ---- Icon picker ---- */
		.flagger__icon-picker {
			position: relative;
		}

		.flagger__icon-current {
			display: flex;
			align-items: center;
			justify-content: center;
			width: 2.5rem;
			height: 1.75rem;
			padding: 0;
			border: 1px solid color-mix(in srgb, var(--text-color) 40%, transparent);
			background: transparent;
			color: var(--text-color);
			border-radius: 4px;
			cursor: pointer;
			/* Anchor for the popup grid's anchor positioning. */
			anchor-name: --flag-icon-anchor;
		}

		.flagger__icon-current svg {
			width: 1.1rem;
			height: 1.1rem;
			fill: currentColor;
		}

		.flagger__icon-grid {
			/*
			 * Anchor the popup to the icon button and let the browser flip it
			 * into view when it would otherwise overflow the viewport.
			 */
			position: fixed;
			position-anchor: --flag-icon-anchor;
			position-area: bottom span-right;
			margin: 0.35rem 0;
			position-try-fallbacks: flip-block, flip-inline, flip-block flip-inline;
			z-index: 10;
			display: grid;
			grid-template-columns: repeat(4, 2rem);
			gap: 0.25rem;
			padding: 0.5rem;
			background: Canvas;
			color: CanvasText;
			border: 1px solid color-mix(in srgb, var(--text-color) 30%, transparent);
			border-radius: 6px;
			box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15);
		}

		.flagger__icon-grid[hidden] {
			display: none;
		}

		.flagger__icon-grid button {
			display: flex;
			align-items: center;
			justify-content: center;
			width: 2rem;
			height: 2rem;
			padding: 0.25rem;
			border: 1px solid transparent;
			background: transparent;
			color: inherit;
			border-radius: 4px;
			cursor: pointer;
		}

		.flagger__icon-grid button:hover {
			background: color-mix(in srgb, currentColor 10%, transparent);
		}

		.flagger__icon-grid button svg {
			width: 100%;
			height: 100%;
			fill: currentColor;
		}

		.flagger__icon-grid button[aria-selected="true"] {
			outline: 2px solid currentColor;
			outline-offset: -1px;
		}

		/* ---- Tester ---- */
		.tester {
			display: flex;
			flex-direction: column;
			gap: 1.5rem;
			margin-top: 2.5rem;
		}

		.tester__select {
			height: 1.75rem;
			padding: 0 0.4rem;
			font-family: system-ui, sans-serif;
			font-size: 0.8rem;
			color: var(--text-color);
			background: transparent;
			border: 1px solid color-mix(in srgb, var(--text-color) 40%, transparent);
			border-radius: 4px;
			cursor: pointer;
		}

		.tester__stage {
			border: 1px solid color-mix(in srgb, var(--text-color) 15%, transparent);
			border-radius: 8px;
			transition: background 0.15s ease;
		}

		.tester__text {
			display: block;
			padding: 1.25rem;
			outline: none;
			color: var(--text-color);
			font-size: var(--size, 48px);
			line-height: var(--lh, 1.3);
			letter-spacing: var(--tracking, 0);
			font-variation-settings: "wght" var(--wght, 400), "slnt" var(--slnt, 0);
			font-feature-settings: var(--ssets, normal);
		}

		.tester__stage--invert {
			background: var(--text-color);
			border-color: transparent;
		}

		.tester__stage--invert .tester__text {
			color: var(--invert-text-color);
		}

		.flag {
			/* Visual height of the flag; the text is sized to match this. */
			--flag-height: 300px;
			display: flex;
      justify-content: safe center;
			overflow: hidden;
			max-width: 100%;
		}

		.flag-scale {
			display: flex;
			align-items: flex-end;
			gap: 0.5rem;
			/*
			 * Scaled down by JS (capped at 1) when the content would otherwise
			 * overflow the available width, so the flag always fits the viewport.
			 */
			transform-origin: left center;
			transform: scale(var(--flag-scale, 1));
		}

		.flag-svg {
			height: var(--flag-height);
			width: auto;
			flex: none;
			margin: 2.5rem 0;
		}

		.flag-text {
			flex: 0 1 auto;
			display: flex;
			flex-direction: column;
			align-items: stretch;
			/* Line height operates as the gap between trimmed lines. */
			gap: calc(var(--lh, 0) * 1em);
			text-align: right;
			color: var(--text-color);
			line-height: 1;
			overflow: visible;
			/* Flag text is always oblique -10. Weight comes from the slider. */
			font-variation-settings: "wght" var(--wght, 100), "slnt" -10;
			font-feature-settings: var(--ssets, normal);
			margin: 2.5rem 0;
		}

		.flag-line {
			display: block;
			white-space: pre;
			text-align: right;
			outline: none;
      text-box-trim: trim-both;
      text-box-edge: cap alphabetic;
			/*
			 * Per-line dedent: a line whose baseline sits `x%` of the text
			 * height above the bottom is shifted right by height * x% * tan(9.5deg).
			 * The shift is computed in JS from the measured baseline position
			 * because the per-line step now includes the line-height gap.
			 */
		}

		option {
			color: var(--text-color);
			background-color: var(--invert-text-color);
		}
	</style>
</head>
<body>
	<div class="content">
		<section class="one-liners"></section>
    <section class="flagger">
      <div class="flagger__controls">
        <label class="ctl">
          <span class="ctl__label">Weight<output class="ctl__value"></output></span>
          <input type="range" id="flagWeight" min="100" max="900" step="1" value="100">
        </label>
        <label class="ctl">
          <span class="ctl__label">Line gap<output class="ctl__value"></output><button type="button" class="ctl__reset" aria-label="Reset line gap">Reset</button></span>
          <input type="range" id="flagLineHeight" min="0" max="2" step="0.01" value="0.1" data-decimals="2" data-default="0.1">
        </label>
        <div class="ctl">Gradient
          <div class="flagger__toggle" id="flagGradientToggle">
            <button type="button" data-gradient="cyan" aria-pressed="true" aria-label="Cyan" style="--swatch-start: #00E5EA; --swatch-end: #00B5CC;">Cyan</button>
            <button type="button" data-gradient="amber" aria-pressed="false" aria-label="Amber" style="--swatch-start: #FFD626; --swatch-end: #FFA300;">Amber</button>
            <button type="button" data-gradient="magenta" aria-pressed="false" aria-label="Magenta" style="--swatch-start: #FBCFE8; --swatch-end: #DB2777;">Magenta</button>
            <button type="button" data-gradient="emerald" aria-pressed="false" aria-label="Emerald" style="--swatch-start: #6EE7B7; --swatch-end: #059669;">Emerald</button>
          </div>
        </div>
        <div class="ctl">Stylistic sets
          <div class="flagger__toggle flagger__toggle--text" id="flagStylisticToggle">
            <button type="button" data-feature="ss01" aria-pressed="false">Alt. J</button>
            <button type="button" data-feature="ss02" aria-pressed="false">Alt. a</button>
            <button type="button" data-feature="ss03" aria-pressed="false">Alt. Symm. S</button>
            <button type="button" data-feature="ss04" aria-pressed="false">Alt. Asymm. S</button>
          </div>
        </div>
        <div class="ctl">Features
          <div class="flagger__toggle flagger__toggle--text" id="flagFeatureToggle">
            <button type="button" data-feature="case" aria-pressed="false">Case</button>
            <button type="button" data-feature="tnum" aria-pressed="false">Tab. Num.</button>
          </div>
        </div>
        <div class="ctl">Icon
          <div class="flagger__icon-picker" id="flagIconPicker">
            <button type="button" class="flagger__icon-current" id="flagIconButton" aria-haspopup="true" aria-expanded="false" aria-label="Select icon">
              <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#iconMeme"></use></svg>
            </button>
            <div class="flagger__icon-grid" id="flagIconGrid" role="listbox" hidden></div>
          </div>
        </div>
      </div>
      <div class="flag">
        <div class="flag-scale">
        <div class="flag-text" id="flagText"></div>
        <svg class="flag-svg" viewBox="0 0 222 214" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M32.09 0.0317383H40.96L8.87 213.962H0L32.09 0.0317383Z" fill="url(#flagGradient)"/>
          <path d="M146.21 13.402C148.4 -1.13804 83.8 0.0219644 48.93 0.0219644L36 86.192C69.36 84.252 135.5 84.192 133.21 99.462C132.07 107.042 127.68 106.752 127.11 110.542C125.59 120.682 198.05 116.162 208.26 115.062L186.4 72.122L221.1 28.832C203.63 30.642 138.63 33.772 139.99 24.682C140.72 19.812 145.4 19.122 146.21 13.402Z" fill="url(#flagGradient)"/>

          <defs>
            <linearGradient id="flagGradient" x1="45.903" y1="-5.91406" x2="45.903" y2="208.243" gradientUnits="userSpaceOnUse">
              <stop stop-color="#00E5EA"/>
              <stop offset="1" stop-color="#00B5CC"/>
            </linearGradient>
						<linearGradient id="iconGradient" x1="17.18" y1="1.17" x2="17.18" y2="34.97" gradientUnits="userSpaceOnUse">
							<stop stop-color="#0069A5"/>
							<stop offset="1" stop-color="#003D6B"/>
						</linearGradient>

						</symbol>
						<symbol id="iconBowTie" viewBox="0 0 24 24">

	<script>
		(function () {
			"use strict";

			const STYLES = [
				{ name: "Oare Sans Thin", wght: 100, slnt: 0 },
				{ name: "Oare Sans Thin Oblique", wght: 100, slnt: -10 },
				{ name: "Oare Sans ExtraLight", wght: 200, slnt: 0 },
				{ name: "Oare Sans ExtraLight Oblique", wght: 200, slnt: -10 },
				{ name: "Oare Sans Light", wght: 300, slnt: 0 },
				{ name: "Oare Sans Light Oblique", wght: 300, slnt: -10 },
				{ name: "Oare Sans", wght: 400, slnt: 0 },
				{ name: "Oare Sans Oblique", wght: 400, slnt: -10 },
				{ name: "Oare Sans Medium", wght: 500, slnt: 0 },
				{ name: "Oare Sans Medium Oblique", wght: 500, slnt: -10 },
				{ name: "Oare Sans SemiBold", wght: 600, slnt: 0 },
				{ name: "Oare Sans SemiBold Oblique", wght: 600, slnt: -10 },
				{ name: "Oare Sans Bold", wght: 700, slnt: 0 },
				{ name: "Oare Sans Bold Oblique", wght: 700, slnt: -10 },
				{ name: "Oare Sans ExtraBold", wght: 800, slnt: 0 },
				{ name: "Oare Sans ExtraBold Oblique", wght: 800, slnt: -10 },
				{ name: "Oare Sans Black", wght: 900, slnt: 0 },
				{ name: "Oare Sans Black Oblique", wght: 900, slnt: -10 }
			];

			// Hardcoded row configuration. Each row sets a `styleIndex` (0-17,
			// matching the STYLES array above) and the `text` to display.
			const ROWS = [
				{ styleIndex: 1 /* Thin Oblique */, text: "Ethnocentrically Thermostatically" },
        { styleIndex: 2 /* ExtraLight */, text: "Circumstantiates Indemnifying" },
        { styleIndex: 5 /* Light Oblique */, text: "Counterfeiter Dissymmetrical" },
        { styleIndex: 6 /* Regular */, text: "Chromatography Handicraft" },
        { styleIndex: 9 /* Medium Oblique */, text: "Usurpation Immunologists" },
        { styleIndex: 10 /* SemiBold */, text: "Allegorise Dematerializing" },
        { styleIndex: 13 /* Bold Oblique */, text: "Beholder Conscientiously" },
        { styleIndex: 14 /* ExtraBold */, text: "Inoculate Dessertspoons" },
        { styleIndex: 17 /* Black Oblique */, text: "Councilmen Capsulation" }
			];

			const params = new URLSearchParams(window.location.search);

			// Primary text color, e.g. ?color=e63946 or ?color=red
			const color = params.get("color");
			if (color) {
				const value = /^[0-9a-fA-F]{3,8}$/.test(color) ? "#" + color : color;
				document.documentElement.style.setProperty("--text-color", value);
			}

			// Text color on inverted stages, e.g. ?invertColor=e63946 or ?invertColor=black
			const invertColor = params.get("invertColor");
			if (invertColor) {
				const value = /^[0-9a-fA-F]{3,8}$/.test(invertColor) ? "#" + invertColor : invertColor;
				document.documentElement.style.setProperty("--invert-text-color", value);
			}

			function clampStyle(index) {
				if (Number.isNaN(index) || index < 0 || index >= STYLES.length) return 0;
				return index;
			}

			// Measure the text at a reference size and derive the `--fit`
			// coefficient so that `--fit * 1cqw` fills the container width. CSS
			// `clamp()` + `cqw` then handle bounds and live resizing.
			const REFERENCE_FONT_SIZE = 100;
			function fitText(textEl) {
				textEl.style.fontSize = REFERENCE_FONT_SIZE + "px";
				const textWidth = textEl.scrollWidth;
				textEl.style.fontSize = "";
				if (textWidth <= 0) return;
				// 100cqw === container width, so the coefficient is
				// 100 * referenceSize / textWidthAtReference.
				const coefficient = (100 * REFERENCE_FONT_SIZE) / textWidth;
				textEl.style.setProperty("--fit", coefficient);
			}

			function applyStyle(textEl, styleIndex) {
				const style = STYLES[styleIndex];
				textEl.style.setProperty("--wght", style.wght);
				textEl.style.setProperty("--slnt", style.slnt);
			}

			function buildRow(config) {
				const row = document.createElement("div");
				row.className = "one-liner";

				const select = document.createElement("select");
				select.className = "one-liner__style";
				STYLES.forEach((style, index) => {
					const option = document.createElement("option");
					option.value = String(index);
					option.textContent = style.name;
					select.appendChild(option);
				});
				select.value = String(config.styleIndex);

				const text = document.createElement("div");
				text.className = "one-liner__text";
				text.contentEditable = "plaintext-only";
				text.spellcheck = false;
				text.setAttribute("data-placeholder", STYLES[config.styleIndex].name);
				text.textContent = config.text || STYLES[config.styleIndex].name;

				row.appendChild(select);
				row.appendChild(text);

				const refit = () => fitText(text);

				select.addEventListener("change", () => {
					const index = clampStyle(parseInt(select.value, 10));
					applyStyle(text, index);
					text.setAttribute("data-placeholder", STYLES[index].name);
					refit();
				});

				text.addEventListener("input", refit);

				applyStyle(text, config.styleIndex);
				return { row, refit };
			}

			const container = document.querySelector(".one-liners");
			const rows = ROWS.map((config) => buildRow({
				styleIndex: clampStyle(config.styleIndex),
				text: config.text
			}));
			rows.forEach(({ row }) => container.appendChild(row));

			function refitAll() {
				rows.forEach(({ refit }) => refit());
			}

			// Recompute the coefficient once fonts are ready. Container width
			// changes are handled automatically by `cqw`, so no resize listener
			// is needed.
			if (document.fonts && document.fonts.ready) {
				document.fonts.ready.then(refitAll);
			}
			refitAll();
		})();

		// ---- Flagger ----
		(function () {
			"use strict";

			const textEl = document.getElementById("flagText");
			const svg = document.querySelector(".flag-svg");
			const flagEl = document.querySelector(".flag");
			const scaleEl = document.querySelector(".flag-scale");
			const weightInput = document.getElementById("flagWeight");
			const lineHeightInput = document.getElementById("flagLineHeight");
			const gradientToggle = document.getElementById("flagGradientToggle");
			const stylisticToggle = document.getElementById("flagStylisticToggle");
			const featureToggle = document.getElementById("flagFeatureToggle");
			if (!textEl || !svg) return;

			const GRADIENTS = {
				cyan: ["#00E5EA", "#00B5CC"],
				amber: ["#FFD626", "#FFA300"],
				magenta: ["#F472B6", "#DB2777"],
				emerald: ["#6EE7B7", "#059669"],
			};

			// Editable text model: one entry per line.
			let lines = ["KIKAKU", "MUNDO"];

			function getCaret(lineEl) {
				const sel = window.getSelection();
				if (!sel || !sel.rangeCount) return 0;
				return sel.getRangeAt(0).startOffset;
			}

			function setCaret(lineEl, offset) {
				const len = lineEl.textContent.length;
				const off = Math.max(0, Math.min(offset, len));
				const range = document.createRange();
				if (lineEl.firstChild) {
					range.setStart(lineEl.firstChild, off);
				} else {
					range.setStart(lineEl, 0);
				}
				range.collapse(true);
				const sel = window.getSelection();
				sel.removeAllRanges();
				sel.addRange(range);
			}

			// Size the text so the combined height of all lines (including the
			// line-height gaps) equals the flag height. Because the gap is em-based,
			// the whole block scales linearly with font size, so we measure at the
			// current size and rescale to the target, then update the dedent.
			const TAN_9_5 = Math.tan((9.5 * Math.PI) / 180);
			function updateSize() {
				const lh = parseFloat(lineHeightInput.value) || 0;
				const flagHeight = svg.getBoundingClientRect().height;
				if (flagHeight <= 0) return;
				textEl.style.setProperty("--lh", lh);
				const current = parseFloat(getComputedStyle(textEl).fontSize) || 100;
				const measured = textEl.getBoundingClientRect().height;
				if (measured > 0) {
					textEl.style.fontSize = (current * flagHeight / measured) + "px";
				}
				updateDedent();
				updateScale();
			}

			// Scale the flag down (never up) so its content fits the available
			// width. The natural size is preserved as the maximum.
			function updateScale() {
				if (!flagEl || !scaleEl) return;
				scaleEl.style.setProperty("--flag-scale", 1);
				const natural = scaleEl.getBoundingClientRect().width;
				const available = flagEl.clientWidth;
				const scale = natural > available && natural > 0
					? available / natural
					: 1;
				scaleEl.style.setProperty("--flag-scale", scale);
			}

			// Shift each line right by (baseline distance from bottom) * tan(9.5deg).
			// With cap/alphabetic trimming each line box bottom sits on its baseline.
			function updateDedent() {
				const bottom = textEl.getBoundingClientRect().bottom;
				Array.from(textEl.children).forEach((line) => {
					const baselineFromBottom = bottom - line.getBoundingClientRect().bottom;
					line.style.transform = "translateX(" + (baselineFromBottom * TAN_9_5) + "px)";
				});
			}

			function bindLine(div, index) {
				div.addEventListener("keydown", (e) => {
					if (e.key === "Enter") {
						e.preventDefault();
						const caret = getCaret(div);
						const value = div.textContent;
						lines.splice(index, 1, value.slice(0, caret), value.slice(caret));
						render();
						const next = textEl.children[index + 1];
						next.focus();
						setCaret(next, 0);
					} else if (e.key === "Backspace" && getCaret(div) === 0 && index > 0) {
						e.preventDefault();
						const prevLen = lines[index - 1].length;
						lines.splice(index - 1, 2, lines[index - 1] + div.textContent);
						render();
						const target = textEl.children[index - 1];
						target.focus();
						setCaret(target, prevLen);
					} else if (e.key === "Delete" && getCaret(div) === div.textContent.length && index < lines.length - 1) {
						e.preventDefault();
						const here = div.textContent.length;
						lines.splice(index, 2, div.textContent + lines[index + 1]);
						render();
						const target = textEl.children[index];
						target.focus();
						setCaret(target, here);
					}
				});

				div.addEventListener("input", () => {
					const value = div.textContent;
					if (value.includes("\n")) {
						const parts = value.split("\n");
						lines.splice(index, 1, ...parts);
						render();
						const target = textEl.children[index + parts.length - 1];
						target.focus();
						setCaret(target, target.textContent.length);
					} else {
						const wasEmpty = lines[index].length === 0;
						lines[index] = value;
						// A new line starts empty and contributes no measurable
						// height; remeasure once it first receives content.
						if (wasEmpty && value.length > 0) {
							updateSize();
						} else {
							// Width changes as text is typed; refit the scale.
							updateScale();
						}
					}
				});
			}

			function render() {
				textEl.textContent = "";
				lines.forEach((line, i) => {
					const div = document.createElement("div");
					div.className = "flag-line";
					div.contentEditable = "plaintext-only";
					div.spellcheck = false;
					div.textContent = line;
					bindLine(div, i);
					textEl.appendChild(div);
				});
				updateSize();
			}

			function setGradient(key) {
				const preset = GRADIENTS[key] || GRADIENTS.cyan;
				const stops = svg.querySelectorAll("#flagGradient stop");
				if (stops[0]) stops[0].setAttribute("stop-color", preset[0]);
				if (stops[1]) stops[1].setAttribute("stop-color", preset[1]);
				Array.from(gradientToggle.querySelectorAll("button")).forEach((btn) => {
					btn.setAttribute("aria-pressed", String(btn.dataset.gradient === key));
				});
			}

			weightInput.addEventListener("input", () => {
				textEl.style.setProperty("--wght", weightInput.value);
				updateScale();
			});
			lineHeightInput.addEventListener("input", updateSize);
			window.addEventListener("resize", updateScale);
			gradientToggle.addEventListener("click", (e) => {
				const btn = e.target.closest("button[data-gradient]");
				if (btn) setGradient(btn.dataset.gradient);
			});

			function updateStylisticSets() {
				const active = [stylisticToggle, featureToggle].flatMap((toggle) =>
					Array.from(toggle.querySelectorAll('button[aria-pressed="true"]'))
				).map((btn) => '"' + btn.dataset.feature + '" 1');
				textEl.style.setProperty("--ssets", active.length ? active.join(", ") : "normal");
			}

			[stylisticToggle, featureToggle].forEach((toggle) => {
				toggle.addEventListener("click", (e) => {
					const btn = e.target.closest("button[data-feature]");
					if (!btn) return;
					const pressed = btn.getAttribute("aria-pressed") === "true";
					btn.setAttribute("aria-pressed", String(!pressed));
					updateStylisticSets();
				});
			});

			// ---- Icon picker ----
			const iconContainer = svg.querySelector("#iconContainer");
			const iconButton = document.getElementById("flagIconButton");
			const iconGrid = document.getElementById("flagIconGrid");
			const iconPicker = document.getElementById("flagIconPicker");

			if (iconContainer && iconButton && iconGrid && iconPicker) {
				// Available icons, derived from the <symbol> definitions in the SVG.
				const ICONS = Array.from(svg.querySelectorAll("symbol[id^='icon']"))
					.map((sym) => "#" + sym.id);
				let currentIcon = iconContainer.getAttribute("href") || ICONS[0];

				function setIcon(href) {
					currentIcon = href;
					iconContainer.setAttribute("href", href);
					iconButton.querySelector("use").setAttribute("href", href);
					Array.from(iconGrid.children).forEach((btn) => {
						btn.setAttribute("aria-selected", String(btn.dataset.icon === href));
					});
				}

				function openGrid() {
					iconGrid.hidden = false;
					iconButton.setAttribute("aria-expanded", "true");
				}

				function closeGrid() {
					iconGrid.hidden = true;
					iconButton.setAttribute("aria-expanded", "false");
				}

				ICONS.forEach((href) => {
					const btn = document.createElement("button");
					btn.type = "button";
					btn.dataset.icon = href;
					btn.setAttribute("role", "option");
					btn.innerHTML =
						'<svg viewBox="0 0 24 24" aria-hidden="true"><use href="' + href + '"></use></svg>';
					btn.addEventListener("click", () => {
						setIcon(href);
						closeGrid();
					});
					iconGrid.appendChild(btn);
				});

				iconButton.addEventListener("click", () => {
					if (iconGrid.hidden) openGrid();
					else closeGrid();
				});

				document.addEventListener("click", (e) => {
					if (!iconPicker.contains(e.target)) closeGrid();
				});

				setIcon(currentIcon);
			}

			// Initial state.
			textEl.style.setProperty("--wght", weightInput.value);
			setGradient("cyan");
			updateStylisticSets();
			render();

			if (document.fonts && document.fonts.ready) {
				document.fonts.ready.then(updateSize);
			}
			if (typeof ResizeObserver !== "undefined") {
				new ResizeObserver(updateSize).observe(svg);
			}
		})();

		// ---- Tester ----
		(function () {
			"use strict";

			// Named instances exposed in the dropdown. Each maps to a weight and
			// slant; the dropdown drives the sliders and vice versa.
			const INSTANCES = [
				{ name: "Thin", wght: 100, slnt: 0 },
				{ name: "Thin Oblique", wght: 100, slnt: -10 },
				{ name: "ExtraLight", wght: 200, slnt: 0 },
				{ name: "ExtraLight Oblique", wght: 200, slnt: -10 },
				{ name: "Light", wght: 300, slnt: 0 },
				{ name: "Light Oblique", wght: 300, slnt: -10 },
				{ name: "Regular", wght: 400, slnt: 0 },
				{ name: "Oblique", wght: 400, slnt: -10 },
				{ name: "Medium", wght: 500, slnt: 0 },
				{ name: "Medium Oblique", wght: 500, slnt: -10 },
				{ name: "SemiBold", wght: 600, slnt: 0 },
				{ name: "SemiBold Oblique", wght: 600, slnt: -10 },
				{ name: "Bold", wght: 700, slnt: 0 },
				{ name: "Bold Oblique", wght: 700, slnt: -10 },
				{ name: "ExtraBold", wght: 800, slnt: 0 },
				{ name: "ExtraBold Oblique", wght: 800, slnt: -10 },
				{ name: "Black", wght: 900, slnt: 0 },
				{ name: "Black Oblique", wght: 900, slnt: -10 }
			];

			const instanceSelect = document.getElementById("testInstance");
			const sizeInput = document.getElementById("testSize");
			const weightInput = document.getElementById("testWeight");
			const slantInput = document.getElementById("testSlant");
			const lineHeightInput = document.getElementById("testLineHeight");
			const trackingInput = document.getElementById("testTracking");
			const stylisticToggle = document.getElementById("testStylisticToggle");
			const featureToggle = document.getElementById("testFeatureToggle");
			const invertToggle = document.getElementById("testInvertToggle");
			const stage = document.getElementById("testStage");
			const textEl = document.getElementById("testText");
			if (!textEl) return;

			INSTANCES.forEach((inst, index) => {
				const option = document.createElement("option");
				option.value = String(index);
				option.textContent = inst.name;
				instanceSelect.appendChild(option);
			});

			// Pick the instance whose weight/slant is nearest to the sliders. The
			// weight span (800) dwarfs the slant span (10), so normalise each axis
			// before comparing.
			function closestInstance(wght, slnt) {
				let best = 0;
				let bestDist = Infinity;
				INSTANCES.forEach((inst, index) => {
					const dw = (inst.wght - wght) / 800;
					const ds = (inst.slnt - slnt) / 10;
					const dist = dw * dw + ds * ds;
					if (dist < bestDist) {
						bestDist = dist;
						best = index;
					}
				});
				return best;
			}

			function applyVariation() {
				textEl.style.setProperty("--wght", weightInput.value);
				textEl.style.setProperty("--slnt", slantInput.value);
			}

			function syncInstanceFromSliders() {
				const index = closestInstance(
					parseFloat(weightInput.value),
					parseFloat(slantInput.value)
				);
				instanceSelect.value = String(index);
			}

			instanceSelect.addEventListener("change", () => {
				const inst = INSTANCES[parseInt(instanceSelect.value, 10)] || INSTANCES[0];
				weightInput.value = String(inst.wght);
				slantInput.value = String(inst.slnt);
				applyVariation();
			});

			weightInput.addEventListener("input", () => {
				applyVariation();
				syncInstanceFromSliders();
			});
			slantInput.addEventListener("input", () => {
				applyVariation();
				syncInstanceFromSliders();
			});

			sizeInput.addEventListener("input", () => {
				textEl.style.setProperty("--size", sizeInput.value + "px");
			});
			lineHeightInput.addEventListener("input", () => {
				textEl.style.setProperty("--lh", lineHeightInput.value);
			});
			trackingInput.addEventListener("input", () => {
				textEl.style.setProperty("--tracking", trackingInput.value + "em");
			});

			function updateStylisticSets() {
				const active = [stylisticToggle, featureToggle].flatMap((toggle) =>
					Array.from(toggle.querySelectorAll('button[aria-pressed="true"]'))
				).map((btn) => '"' + btn.dataset.feature + '" 1');
				textEl.style.setProperty("--ssets", active.length ? active.join(", ") : "normal");
			}

			[stylisticToggle, featureToggle].forEach((toggle) => {
				toggle.addEventListener("click", (e) => {
					const btn = e.target.closest("button[data-feature]");
					if (!btn) return;
					const pressed = btn.getAttribute("aria-pressed") === "true";
					btn.setAttribute("aria-pressed", String(!pressed));
					updateStylisticSets();
				});
			});

			invertToggle.addEventListener("click", (e) => {
				const btn = e.target.closest("button[data-invert]");
				if (!btn) return;
				const pressed = btn.getAttribute("aria-pressed") === "true";
				btn.setAttribute("aria-pressed", String(!pressed));
				stage.classList.toggle("tester__stage--invert", !pressed);
			});

			// Initial state.
			textEl.style.setProperty("--size", sizeInput.value + "px");
			textEl.style.setProperty("--lh", lineHeightInput.value);
			textEl.style.setProperty("--tracking", trackingInput.value + "em");
			applyVariation();
			syncInstanceFromSliders();
			updateStylisticSets();
		})();

		// ---- Slider value displays + resets ----
		(function () {
			"use strict";

			// Wire every range slider to its live value display and optional reset
			// button. Formatting comes from data-decimals / data-unit on the input;
			// the default value for reset comes from data-default.
			document.querySelectorAll(".ctl").forEach((ctl) => {
				const input = ctl.querySelector('input[type="range"]');
				if (!input) return;
				const output = ctl.querySelector(".ctl__value");
				const reset = ctl.querySelector(".ctl__reset");
				const decimals = parseInt(input.dataset.decimals || "0", 10);
				const unit = input.dataset.unit || "";

				const format = () => {
					if (!output) return;
					const value = decimals
						? parseFloat(input.value).toFixed(decimals)
						: input.value;
					output.textContent = value + unit;
				};

				input.addEventListener("input", format);

				if (reset) {
					reset.addEventListener("click", () => {
						if (input.dataset.default !== undefined) {
							input.value = input.dataset.default;
						}
						// Let the owning section react to the change, then refresh
						// the value display.
						input.dispatchEvent(new Event("input", { bubbles: true }));
					});
				}

				format();
			});
		})();

		// ---- Auto-height reporting ----
		// An iframe is a replaced element, so the parent page cannot size it to
		// its content (CSS `height: fit-content`/`auto` have no effect, and a
		// cross-origin parent can't read this document at all). Instead we
		// measure our own content height and post it to the parent, which can
		// resize the iframe in response. See the README/embed snippet for the
		// matching parent-side listener.
		(function () {
			"use strict";

			function currentHeight() {
				// Measure the body's content box, not `documentElement`. Once the
				// parent sizes the iframe tall, the root element's height/scrollHeight
				// is floored at the (now tall) viewport, so it can never report a
				// smaller value when content shrinks. `body` has `margin:0`, so its
				// border-box height tracks content in both directions.
				return Math.ceil(document.body.getBoundingClientRect().height);
			}

			let lastHeight = 0;
			function report() {
				const height = currentHeight();
				if (height === lastHeight) return;
				lastHeight = height;
				// `*` target origin keeps the embed drop-in; the parent should
				// still verify `event.origin`/`event.source` before trusting it.
				window.parent.postMessage(
					{ type: "oare-sans:embed-height", height },
					"*"
				);
			}

			// Report on load, when fonts settle, and whenever content reflows.
			window.addEventListener("load", report);
			if (document.fonts && document.fonts.ready) {
				document.fonts.ready.then(report);
			}
			if ("ResizeObserver" in window) {
				new ResizeObserver(report).observe(document.body);
			} else {
				window.addEventListener("resize", report);
			}
			// Allow the parent to request a height on demand.
			window.addEventListener("message", (event) => {
				if (event.data && event.data.type === "oare-sans:request-height") {
					lastHeight = 0;
					report();
				}
			});
			report();
		})();
	</script>
</body>
</html>
